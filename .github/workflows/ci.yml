name: CI — order-service

# Gate de qualidade deste microsserviço: unit + integração (MongoDB order) + build.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-order-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: order-service
  NEW_RELIC_ENABLED: 'false'
  MONGODB_URI: mongodb://127.0.0.1:27017/order

jobs:
  test:
    name: Testes + build (order)
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Testes unitários
        run: yarn test

      - name: Testes de integração (MongoDB order)
        run: yarn test:integration

      - name: Build
        run: yarn build

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # shortcut: na main o Sonar devolve NONE sem período de new code; aí valem os limiares do Sonar way no código inteiro. Quando o status vier OK/ERROR, esse fallback não roda.
      - name: Quality Gate SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: oficina-pos-fiap_order-service
        run: |
          set -euo pipefail
          meta=.scannerwork/report-task.txt
          server=$(sed -n 's/^serverUrl=//p' "$meta")
          ce=$(sed -n 's/^ceTaskUrl=//p' "$meta")
          st=PENDING
          for _ in $(seq 1 60); do
            st=$(curl -fsS -u "$SONAR_TOKEN:" "$ce" | jq -r '.task.status')
            if [ "$st" = SUCCESS ]; then break; fi
            if [ "$st" = FAILED ] || [ "$st" = CANCELED ]; then echo "análise Sonar $st"; exit 1; fi
            sleep 5
          done
          if [ "$st" != SUCCESS ]; then echo "análise Sonar não terminou: $st"; exit 1; fi
          id=$(curl -fsS -u "$SONAR_TOKEN:" "$ce" | jq -r '.task.analysisId')
          qg=$(curl -fsS -u "$SONAR_TOKEN:" "$server/api/qualitygates/project_status?analysisId=$id" | jq -r '.projectStatus.status')
          echo "quality gate: $qg"
          if [ "$qg" = OK ] || [ "$qg" = WARN ]; then exit 0; fi
          if [ "$qg" = ERROR ]; then echo "Quality Gate falhou"; exit 1; fi
          if [ "${GITHUB_EVENT_NAME:-}" != push ]; then echo "Quality Gate não calculado ($qg)"; exit 1; fi
          curl -fsS -u "$SONAR_TOKEN:" \
            "$server/api/measures/component?component=$SONAR_PROJECT_KEY&branch=main&metricKeys=coverage,duplicated_lines_density,reliability_rating,security_rating,sqale_rating,security_hotspots_reviewed" \
            | jq -e 'def n($k): (.component.measures[] | select(.metric==$k) | .value | tonumber); (n("coverage") >= 80) and (n("duplicated_lines_density") <= 3) and (n("reliability_rating") <= 1) and (n("security_rating") <= 1) and (n("sqale_rating") <= 1) and (n("security_hotspots_reviewed") >= 100)'

      - name: Upload coverage (order-service)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: order-service-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
