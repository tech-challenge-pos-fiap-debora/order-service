name: Publish ECR — order-service

# Publica as imagens do order-service (API + seed) no ECR e dispara
# o deploy no EKS via infra-kubernetes, com tags dedicadas a este MS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-ecr-order
  cancel-in-progress: false

env:
  SERVICE_NAME: order-service
  AWS_REGION: us-east-1
  API_REPOSITORY: order-service
  SEED_REPOSITORY: order-service-seed
  INFRA_REPOSITORY: infra-kubernetes

jobs:
  publish:
    name: Build e push (order)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API (order-service)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem de seed (order)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: seed
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.SEED_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.SEED_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Inputs dedicados ao order; api_image_tag permanece como fallback
      # enquanto o deploy-prod do infra ainda esperar o nome legado.
      - name: Disparar deploy no EKS (order)
        id: dispatch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "INFRA_DISPATCH_TOKEN nao configurado."
            exit 1
          fi
          gh workflow run deploy-prod.yml \
            --repo "${GITHUB_REPOSITORY_OWNER}/${INFRA_REPOSITORY}" \
            -f service=order-service \
            -f order_image_tag="${GITHUB_SHA}" \
            -f order_seed_image_tag="${GITHUB_SHA}" \
            -f api_image_tag="${GITHUB_SHA}"

      - name: Resumo
        run: |
          {
            echo "## order-service — imagens publicadas"
            echo
            echo "- \`${API_REPOSITORY}:${GITHUB_SHA}\`"
            echo "- \`${SEED_REPOSITORY}:${GITHUB_SHA}\`"
            echo
            echo "Filtro New Relic / logs: \`service = 'order-service'\`."
            echo
            if [ "${{ steps.dispatch.outcome }}" = "success" ]; then
              echo "Deploy no EKS disparado em \`${INFRA_REPOSITORY}\` (service=order-service)."
            else
              echo "### Deploy no EKS nao foi disparado"
              echo
              echo "Rode manualmente:"
              echo
              echo '```bash'
              echo "gh workflow run deploy-prod.yml \\"
              echo "  --repo ${GITHUB_REPOSITORY_OWNER}/${INFRA_REPOSITORY} \\"
              echo "  -f service=order-service \\"
              echo "  -f order_image_tag=${GITHUB_SHA} \\"
              echo "  -f order_seed_image_tag=${GITHUB_SHA} \\"
              echo "  -f api_image_tag=${GITHUB_SHA}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
